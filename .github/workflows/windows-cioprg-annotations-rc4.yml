name: MLAD CIOPRG Annotations RC4 (Windows x64)

on:
  push:
    branches: [feat/pr16-all-rungs-ioname-comments]

permissions:
  contents: write

concurrency:
  group: mlad-annotations-rc4
  cancel-in-progress: false

jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
      VITE_MLAD_PREVIEW_LABEL: "CIOPRG Annotations rc.4"
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Stable Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Safety invariants and pinned dependency check
        shell: pwsh
        run: |
          $source = Get-Content -Raw "src-tauri/src/main.rs"
          if ($source.Contains("pub mod network;")) { throw "Unverified HSES/FTP backend compiled!" }
          if (-not $source.Contains('Мониторинг HSES отключён')) { throw "HSES deny stub missing" }
          if (-not $source.Contains('Загрузка на робот отключена')) { throw "FTP deny stub missing" }
          if (-not $source.Contains('cmd_read_cioprg_page')) { throw "Read-only paging command missing" }
          if (-not $source.Contains('cmd_search_cioprg')) { throw "Source search command missing" }
          if (-not $source.Contains('cmd_inspect_ioname')) { throw "Read-only IONAME command missing" }
          if (-not (Test-Path "src/components/NativeWorkspace.tsx")) { throw "Native workspace missing" }
          if (-not (Test-Path "package-lock.json")) { throw "npm lockfile missing" }

      - name: Install npm dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile not altered
        run: git diff --exit-code -- package.json package-lock.json

      - name: Verify docs and all frontend tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run docs:check
          if ($LASTEXITCODE -ne 0) { throw "Docs check failed" }
          npm run test:security
          if ($LASTEXITCODE -ne 0) { throw "Offline safety check failed" }
          npm run test:native
          if ($LASTEXITCODE -ne 0) { throw "Native workspace check failed" }
          npm run test:graph
          if ($LASTEXITCODE -ne 0) { throw "Graph tests failed" }
          npm run test:advanced
          if ($LASTEXITCODE -ne 0) { throw "Advanced tests failed" }
          npm run test:visual
          if ($LASTEXITCODE -ne 0) { throw "Visual tests failed" }
          npm run test:inline
          if ($LASTEXITCODE -ne 0) { throw "Inline tests failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }

      - name: Rust unit tests Windows MSVC
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows NSIS and portable binary
        run: npm run tauri -- build --bundles nsis

      - name: Package portable, installer, GPL sources, SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.5.0-rc.4-annotations"
          New-Item -ItemType Directory -Path "release-dist","release-stage" -Force | Out-Null
          $exe = "src-tauri/target/release/yaskawa-ladder-ide.exe"
          if (-not (Test-Path $exe)) { throw "Main executable missing" }
          Copy-Item $exe "release-stage/yaskawa-ladder-ide.exe"
          Copy-Item "LICENSE" "release-stage/LICENSE"
          Copy-Item "docs/releases/v0.5.0-rc.4-annotations.md" "release-stage/README.md"
          Compress-Archive -Path "release-stage/*" -DestinationPath "release-dist/MLAD-CIOPRG-Annotations-rc4-win-x64-portable.zip" -CompressionLevel Optimal -Force
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($nsis.Count -ne 1) { throw "Expected one NSIS installer, got $($nsis.Count)" }
          Copy-Item $nsis[0].FullName "release-dist/MLAD-CIOPRG-Annotations-rc4-win-x64-setup.exe"
          git archive --format=zip -o "release-dist/MLAD-CIOPRG-Annotations-rc4-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
          $assets = @(Get-ChildItem "release-dist" -Filter "*.zip" -File) + @(Get-ChildItem "release-dist" -Filter "*.exe" -File)
          if ($assets.Count -ne 3) { throw "Missing an expected release asset" }
          $lines = $assets | Sort-Object Name | ForEach-Object {
            if ($_.Length -lt 100000) { throw "Suspiciously small asset $($_.Name)" }
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath "release-dist/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem "release-dist" | Format-Table Name,Length -AutoSize
          Get-Content "release-dist/SHA256SUMS.txt"

      - name: Upload downloadable Actions backup
        uses: actions/upload-artifact@v4
        with:
          name: MLAD-CIOPRG-Annotations-rc4-Windows-x64
          path: release-dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub pre-release (never overwrite existing tag)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.5.0-rc.4-annotations"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists: $tag; refusing overwrite" }
          gh release create $tag "release-dist/MLAD-CIOPRG-Annotations-rc4-win-x64-portable.zip" "release-dist/MLAD-CIOPRG-Annotations-rc4-win-x64-setup.exe" "release-dist/MLAD-CIOPRG-Annotations-rc4-source.zip" "release-dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MLAD 0.5.0-rc.4 CIOPRG Annotations (Windows x64)" --notes-file "docs/releases/v0.5.0-rc.4-annotations.md" --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish prerelease" }
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
