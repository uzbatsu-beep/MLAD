name: MLAD UI multi-rung preview (Windows)

on:
  push:
    branches:
      - feat/pr6-multi-rung-state-visualization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlad-ui-preview-pr7
  cancel-in-progress: true

jobs:
  preview:
    name: Windows x64 portable UI preview - no install or controller access
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      VITE_MLAD_PREVIEW_LABEL: "UI Preview PR #7"
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust Windows MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Assert offline-only backend remains blocked
        shell: pwsh
        run: |
          $source = Get-Content "src-tauri/src/main.rs" -Raw
          if (-not $source.Contains('Загрузка на робот отключена')) { throw "FTP guard missing" }
          if (-not $source.Contains('Мониторинг HSES отключён')) { throw "HSES guard missing" }
          if (-not $source.Contains('cmd_test_tmr_step')) { throw "Offline TMR test missing" }
          if (-not (Test-Path "src/ladder/visualState.ts")) { throw "Tri-state visual model missing" }
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests and type-check
        shell: pwsh
        run: |
          npm run test:graph
          if ($LASTEXITCODE -ne 0) { throw "Graph tests failed" }
          npm run test:advanced
          if ($LASTEXITCODE -ne 0) { throw "Advanced tests failed" }
          npm run test:visual
          if ($LASTEXITCODE -ne 0) { throw "Visual tests failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }
      - name: Rust Windows MSVC tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows Tauri binary (known-good NSIS build path)
        run: npm run tauri -- build --bundles nsis
      - name: Create isolated portable preview ZIP with SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "ui-preview"
          New-Item -Path "$root/docs" -ItemType Directory -Force | Out-Null
          $binary = "src-tauri/target/release/yaskawa-ladder-ide.exe"
          if (-not (Test-Path $binary)) { throw "Windows application exe missing" }
          Copy-Item $binary "$root/yaskawa-ladder-ide.exe"
          Copy-Item "docs/ui_multi_rung_state.md" "$root/docs/ui_multi_rung_state.md"
          Copy-Item "docs/advanced_hardware_test_matrix.md" "$root/docs/advanced_hardware_test_matrix.md"
          Copy-Item "docs/releases/v0.5.0-rc.1-hardware.md" "$root/docs/rc-notes.md"
          @'
          MLAD Windows UI Preview - Pull Request #7
          Multi-rung workspace + offline tri-state indicators.
          Not a production release or safety-control tool.
          Requires installed Microsoft WebView2 Runtime.
          Run yaskawa-ladder-ide.exe in this extracted directory.
          Does not install or replace the official v0.5.0-rc.1.
          All CIOPRG.LST writes, FTP and HSES are still disabled.
          Check docs/ui_multi_rung_state.md for test criteria.
          '@ | Set-Content "$root/README.txt"
          $zip="MLAD-UI-Preview-PR7-win-x64-portable.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "UI_PREVIEW_SHA256.txt"
          if ((Get-Item $zip).Length -le 100000) { throw "Suspicious preview archive size" }
          Write-Host "PREVIEW: $zip"
          Get-Content "UI_PREVIEW_SHA256.txt"
      - name: Attach unsigned portable preview (never publish as production release)
        uses: actions/upload-artifact@v4
        with:
          name: MLAD-UI-Preview-PR7-Windows-x64
          path: |
            MLAD-UI-Preview-PR7-win-x64-portable.zip
            UI_PREVIEW_SHA256.txt
          retention-days: 30
          if-no-files-found: error
