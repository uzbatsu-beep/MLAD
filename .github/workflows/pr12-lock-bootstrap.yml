# Temporary PR #12 bootstrap: removed after one-time lockfile generation.
# Guarded to an internal branch; no user-controlled shell inputs.
name: MLAD PR12 lockfile bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/pr12-npm-ci-lockfile'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the dedicated feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/pr12-npm-ci-lockfile
      - name: Set up Node.js 22 and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without executing dependency lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(l.lockfileVersion!==3 || l.packages[''].name!==p.name || l.packages[''].version!==p.version)process.exit(1)"
          git diff --exit-code -- package.json
      - name: Commit lockfile on PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'build: commit npm lockfile snapshot for PR #12'
          git push origin HEAD:refs/heads/chore/pr12-npm-ci-lockfile
