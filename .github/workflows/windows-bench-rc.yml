name: MLAD Bench RC - Windows x64

on:
  push:
    branches:
      - release/0.5.0-rc1-hardware
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlad-bench-v0.5.0-rc.1-hardware
  cancel-in-progress: true

jobs:
  windows-release:
    name: Windows x64 tests, NSIS offline installer and portable ZIP
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure stable Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Windows Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify offline-only backend guardrails
        shell: pwsh
        run: |
          $source = Get-Content -Raw "src-tauri/src/main.rs"
          if (-not $source.Contains('async fn cmd_deploy_to_robot')) { throw "FTP backend command missing" }
          if (-not $source.Contains('Загрузка на робот отключена')) { throw "FTP backend must reject uploads" }
          if (-not $source.Contains('Мониторинг HSES отключён')) { throw "Unverified HSES monitor must be blocked" }
          if (-not $source.Contains('cmd_test_tmr_step')) { throw "Offline timer test missing" }
          if (-not $source.Contains('cmd_test_cnt_step')) { throw "Offline counter test missing" }
          $config = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
          if ($config.version -ne '0.5.0') { throw "Unexpected Tauri build version" }
          if ($config.bundle.windows.webviewInstallMode.type -ne 'offlineInstaller') { throw "Offline WebView2 not configured" }
          if (-not (Test-Path "docs/advanced_hardware_test_matrix.md")) { throw "Bench matrix missing" }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Rust tests (Windows MSVC)
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Graph editor tests
        shell: pwsh
        run: npm run test:graph

      - name: Advanced TMR CNT group tests
        shell: pwsh
        run: npm run test:advanced

      - name: TypeScript and Vite production build
        shell: pwsh
        run: npm run build

      - name: Build Windows NSIS with offline WebView2
        shell: pwsh
        run: npm run tauri -- build --bundles nsis

      - name: Pack portable ZIP installer documentation and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "release-dist"
          $stage = "release-stage"
          New-Item -ItemType Directory -Path $release,$stage,"$stage/docs","$stage/examples" -Force | Out-Null
          $exe = "src-tauri/target/release/yaskawa-ladder-ide.exe"
          if (-not (Test-Path $exe)) { throw "Windows MSVC app executable missing: $exe" }
          Copy-Item $exe "$stage/yaskawa-ladder-ide.exe"
          Copy-Item "docs/releases/v0.5.0-rc.1-hardware.md" "$stage/README.md"
          Copy-Item "docs/advanced_blocks.md" "$stage/docs/advanced_blocks.md"
          Copy-Item "docs/advanced_hardware_test_matrix.md" "$stage/docs/advanced_hardware_test_matrix.md"
          Copy-Item "docs/releases/bench-results-template.csv" "$stage/docs/bench-results-template.csv"
          Copy-Item "examples/bench-demo.advanced.json" "$stage/examples/bench-demo.advanced.json"
          $zip = "$release/MLAD-Bench-v0.5.0-rc.1-win-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          $nsis = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($nsis.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($nsis.Count)" }
          Copy-Item $nsis[0].FullName "$release/MLAD-Bench-v0.5.0-rc.1-win-x64-setup.exe"
          if (-not (Test-Path "package-lock.json")) { throw "Dependency snapshot missing" }
          Copy-Item "package-lock.json" "$release/package-lock-build.json"
          $manifest = Join-Path $release "ARTIFACTS_SHA256.txt"
          $files = @(Get-ChildItem $release -File | Where-Object { $_.Name -ne 'ARTIFACTS_SHA256.txt' })
          if ($files.Count -lt 3) { throw "Missing release assets" }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $lines | Out-File -FilePath $manifest -Encoding utf8
          foreach ($item in $files) {
            if ($item.Length -le 1024) { throw "Suspiciously small release file $($item.Name)" }
          }
          Get-ChildItem $release | Format-Table Name, Length -AutoSize
          Get-Content $manifest

      - name: Upload build artifact even if release publication fails
        uses: actions/upload-artifact@v4
        with:
          name: MLAD-Bench-v0.5.0-rc.1-windows-x64
          path: release-dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.5.0-rc.1-hardware"
          gh release create $tag "release-dist/MLAD-Bench-v0.5.0-rc.1-win-x64-setup.exe" "release-dist/MLAD-Bench-v0.5.0-rc.1-win-x64-portable.zip" "release-dist/ARTIFACTS_SHA256.txt" "release-dist/package-lock-build.json" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MLAD Bench v0.5.0-rc.1 - Offline Yaskawa CIO Diagnostics" --notes-file "docs/releases/v0.5.0-rc.1-hardware.md" --prerelease
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
