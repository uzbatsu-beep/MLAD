name: MLAD validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri 2 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure npm install did not mutate dependency manifests
        run: git diff --exit-code -- package.json package-lock.json
      - name: GitHub Community Standards and Issue Form contract
        run: npm run test:community
      - name: Offline controller safety invariants
        run: npm run test:security
      - name: Native integrated workspace regressions
        run: npm run test:native
      - name: Diagnostic grouping model tests
        run: npm run test:diagnostics
      - name: OEM manual reference labels (no execution)
        run: npm run test:oem-reference
      - name: Markdown internal links and formatting
        run: npm run docs:check
      - name: Verify bilingual Markdown structure, code, identifiers and language switchers
        run: python3 scripts/i18n_verify.py
      - name: Check reviewed translation safety semantics and editorial status
        run: python3 scripts/i18n_semantic_guard.py
      - name: Graph layout and editor model tests
        run: npm run test:graph
      - name: Advanced CIO block UI model tests
        run: npm run test:advanced
      - name: Tri-state visualization tests
        run: npm run test:visual
      - name: Inline operand validation tests
        run: npm run test:inline
      - name: Typecheck and build
        run: npm run build
