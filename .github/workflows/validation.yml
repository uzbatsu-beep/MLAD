name: MLAD validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Avoid spending runners on superseded revisions of a pull request.
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      runtime_required: ${{ steps.classify.outputs.runtime_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes (fail closed to full tests)
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          runtime_required=true
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] &&
             git cat-file -e "$BASE_SHA^{commit}" &&
             git cat-file -e "$HEAD_SHA^{commit}"; then
            changed="$RUNNER_TEMP/mlad-changed-files.txt"
            if git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed" &&
               [[ -s "$changed" ]]; then
              runtime_required=false
              while IFS= read -r file; do
                case "$file" in
                  *.md|scripts/i18n_*.py|scripts/check-docs.mjs)
                    # Documentation and localization only; keep docs checks.
                    ;;
                  *)
                    runtime_required=true
                    break
                    ;;
                esac
              done < "$changed"
            fi
          fi
          echo "runtime_required=$runtime_required" >> "$GITHUB_OUTPUT"
          echo "Native/frontend compilation required: $runtime_required"
          if [[ -f "$RUNNER_TEMP/mlad-changed-files.txt" ]]; then
            cat "$RUNNER_TEMP/mlad-changed-files.txt"
          fi

  rust-tests:
    needs: scope
    # Always test Rust when any non-doc file changes or the diff is unknown.
    if: needs.scope.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Tauri 2 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Reusable Windows acceptance is inside the same CI graph, so the gate can
  # require its true result. The job is skipped ONLY for docs-only changes.
  windows-security:
    needs: scope
    if: needs.scope.outputs.runtime_required == 'true'
    uses: ./.github/workflows/windows-security-acceptance.yml
    permissions:
      contents: read

  frontend-build:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # These checks use Node built-ins/Python stdlib and need no npm install.
      - name: Markdown internal links and formatting
        run: npm run docs:check
      - name: Verify bilingual Markdown structure, code, identifiers and language switchers
        run: python3 scripts/i18n_verify.py
      - name: Check reviewed translation safety semantics and editorial status
        run: python3 scripts/i18n_semantic_guard.py
      - name: Exercise unified CI gate decisions (fail-closed regression tests)
        run: node --test scripts/ci-gate-check.test.mjs
      - name: Install locked frontend dependencies
        if: needs.scope.outputs.runtime_required == 'true'
        run: npm ci --no-audit --no-fund
      - name: Ensure npm install did not mutate dependency manifests
        if: needs.scope.outputs.runtime_required == 'true'
        run: git diff --exit-code -- package.json package-lock.json
      # All Node model/safety/community tests are dependency-free and cheap:
      # run them even for docs-only PRs to preserve non-Rust safety coverage.
      - name: GitHub Community Standards and Issue Form contract
        run: npm run test:community
      - name: Offline controller safety invariants
        run: npm run test:security
      - name: Native integrated workspace regressions
        run: npm run test:native
      - name: PR48 unsigned Windows preview and synthetic offline fixture contracts
        run: node --test scripts/offline-preview-contract.test.mjs
      - name: Diagnostic grouping model tests
        run: npm run test:diagnostics
      - name: OEM manual reference labels (no execution)
        run: npm run test:oem-reference
      - name: Graph layout and editor model tests
        run: npm run test:graph
      - name: Advanced CIO block UI model tests
        run: npm run test:advanced
      - name: Tri-state visualization tests
        run: npm run test:visual
      - name: Inline operand validation tests
        run: npm run test:inline
      - name: Typecheck and build
        if: needs.scope.outputs.runtime_required == 'true'
        run: npm run build

  # Single, always-present required check: never treat a skipped native/Windows
  # job as a pass when a code/configuration change required it.
  ci-gate:
    needs: [scope, frontend-build, rust-tests, windows-security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every applicable job result
        env:
          MLAD_SCOPE_RESULT: ${{ needs.scope.result }}
          MLAD_FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          MLAD_RUST_RESULT: ${{ needs.rust-tests.result }}
          MLAD_WINDOWS_RESULT: ${{ needs.windows-security.result }}
          MLAD_RUNTIME_REQUIRED: ${{ needs.scope.outputs.runtime_required }}
        run: node scripts/ci-gate-check.mjs
