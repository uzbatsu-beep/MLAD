name: PR17 Cargo.lock dependency bootstrap (temporary)

on:
  push:
    branches: [feat/pr17-compact-header-native-file-pickers]

permissions:
  contents: write

jobs:
  pin-rust-dialog-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only new Rust dialog dependency, retain existing versions
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /tmp/pr17-cargo-metadata.json
      - name: Commit dependency lock from real cargo resolution
        run: |
          set -euo pipefail
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "No Cargo.lock changes generated"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pr17): pin tauri-plugin-dialog Rust dependencies"
          git push origin HEAD:feat/pr17-compact-header-native-file-pickers
