name: MLAD PR26 Guarded File Snapshots (Windows x64)

on:
  push:
    branches: [feat/pr26-guarded-file-snapshots]

permissions:
  contents: read

concurrency:
  group: mlad-pr26-guarded-win
  cancel-in-progress: true

jobs:
  windows-security-preview:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check pinned npm lockfile
        run: npm ci --no-audit --no-fund

      - name: Frontend and CSP contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run test:security
          if ($LASTEXITCODE -ne 0) { throw "Security tests failed" }
          npm run test:community
          if ($LASTEXITCODE -ne 0) { throw "Community safety tests failed" }
          npm run docs:check
          if ($LASTEXITCODE -ne 0) { throw "Docs check failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Vite build failed" }

      - name: Windows native and JSON path Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Compile Tauri production executable with CSP
        run: npm run tauri -- build --no-bundle

      - name: Validate unsigned Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "src-tauri/target/release/yaskawa-ladder-ide.exe"
          if (-not (Test-Path $exe)) { throw "Tauri executable not built" }
          $size = (Get-Item $exe).Length
          if ($size -lt 100000) { throw "Executable unexpectedly small" }
          New-Item -ItemType Directory -Path "pr26-preview" -Force | Out-Null
          Copy-Item $exe "pr26-preview/yaskawa-ladder-ide.exe"
          Copy-Item "LICENSE" "pr26-preview/LICENSE"
          Copy-Item "docs/guarded_io_review.md" "pr26-preview/SECURITY-READ-ME.md"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload Windows unsigned CSP testing binary (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: MLAD-PR26-Guarded-IO-Windows-x64-unsigned
          path: pr26-preview/*
          retention-days: 14
          if-no-files-found: error
